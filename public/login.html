<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Kenya Education Presentation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b2a4a 0%, #1a4b8c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: #fff;
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 { font-size: 1.6rem; color: #0b2a4a; margin-bottom: 0.3rem; }
        .subtitle { color: #6b85a0; font-size: 0.9rem; margin-bottom: 2rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #1a3b5d; margin-bottom: 0.4rem; }
        input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 2px solid #d0dde8;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 1.2rem;
        }
        input:focus { outline: none; border-color: #1a4b8c; }
        button {
            width: 100%;
            padding: 0.95rem;
            background: #1a3b5d;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #0b2a4a; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            display: none;
        }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Presenter Login</h1>
        <p class="subtitle">Kenya Education Administration & Management</p>
        <div class="error" id="error"></div>
        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="username" required>
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" required>
            <button type="submit" id="submitBtn">Sign In</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('error');
            const btn = document.getElementById('submitBtn');
            errorBox.classList.remove('show');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Login failed');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/';
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
